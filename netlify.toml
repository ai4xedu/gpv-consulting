# Déploiement GPV — site à la racine, charte graphique en /charte/
# Aucune dépendance ni build système : simple assemblage de fichiers statiques.

[build]
  publish = "dist"
  functions = "netlify/functions"
  command = "rm -rf dist && mkdir -p dist && cp -R site/. dist/ && cp -R charte dist/charte"

# Les photos et logos sont versionnés par leur nom : cache long.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/charte/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# Le HTML doit toujours être revalidé pour que les mises à jour soient immédiates.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
